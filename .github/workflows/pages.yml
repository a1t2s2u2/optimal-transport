name: Deploy site to GitHub Pages

# seminar/*/tex/*.tex を唯一の source とし、push のたびに
# tex → content/*.md → *.html を生成して GitHub Pages へ公開する。
# cuturi をルート / に、wasserstein を /wasserstein/ に配置する。
# 生成物（md/html）はリポジトリに commit せず、ここで都度ビルドする。

on:
  push:
    branches: [main]
    paths:
      - "seminar/*/tex/**"
      - "seminar/*/site.config.mjs"
      - "seminar/*/site-demos.mjs"
      - "seminar/*/site-assets/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを直列化（古いランは取り消す）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # --strict は未解決の \ref や未変換マクロがあればここで失敗させる
      - name: Build site (cuturi)
        run: |
          node tools/site/tex2md.mjs seminar/cuturi --strict
          node tools/site/build.mjs seminar/cuturi

      - name: Build site (wasserstein)
        run: |
          node tools/site/tex2md.mjs seminar/wasserstein --strict
          node tools/site/build.mjs seminar/wasserstein

      - name: Assemble combined site
        run: |
          mkdir -p _site/wasserstein
          cp -R seminar/cuturi/site/dist/. _site/
          cp -R seminar/wasserstein/site/dist/. _site/wasserstein/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
