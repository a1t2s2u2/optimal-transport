name: Deploy site to GitHub Pages

# seminar/*/tex/*.tex を唯一の source とし、push のたびに
# tex → content/*.md → *.html を生成して GitHub Pages へ公開する。
# cuturi をルート / に、wasserstein を /wasserstein/ に配置する。
# 生成物（md/html）はリポジトリに commit せず、ここで都度ビルドする。

on:
  push:
    branches: [main]
    paths:
      - "seminar/cuturi/tex/**"
      - "seminar/cuturi/site/**"
      - "seminar/wasserstein/tex/**"
      - "seminar/wasserstein/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを直列化（古いランは取り消す）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate markdown from TeX (cuturi)
        run: node seminar/cuturi/site/scripts/tex2md.mjs --strict

      - name: Build HTML (cuturi)
        run: node seminar/cuturi/site/scripts/build.mjs

      - name: Generate markdown from TeX (wasserstein)
        run: node seminar/wasserstein/site/scripts/tex2md.mjs --strict

      - name: Build HTML (wasserstein)
        run: node seminar/wasserstein/site/scripts/build.mjs

      - name: Assemble combined site
        run: |
          mkdir -p _site/wasserstein
          cp -R seminar/cuturi/site/dist/. _site/
          cp -R seminar/wasserstein/site/dist/. _site/wasserstein/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
